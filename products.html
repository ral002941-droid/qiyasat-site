<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنتجات | قياسات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --cream:#FAF7F2;
  --lavender:#E9DFF2;
  --purple:#594477;
  --dark:#382D43;
  --muted:#776D7E;
  --border:#E2D7EA;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Cairo,sans-serif;
  background:var(--cream);
  color:var(--dark);
}
a { text-decoration:none; color:inherit; }
button,input,select { font:inherit; }
button { cursor:pointer; }
button:focus-visible,a:focus-visible,
input:focus-visible,select:focus-visible,
summary:focus-visible {
  outline:3px solid var(--purple);
  outline-offset:3px;
}
header {
  background:white;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  box-shadow:0 2px 15px #59447712;
}
.logo {
  font-size:26px;
  font-weight:800;
  color:var(--purple);
}
nav { display:flex;gap:18px;flex-wrap:wrap; }
nav a { font-size:14px; }
nav a:hover { color:var(--purple); }
main { width:min(1200px,92%);margin:35px auto; }
.hero {
  background:var(--lavender);
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
}
.hero h1 { color:var(--purple);margin:0 0 8px; }
.hero p { margin:0;line-height:1.9; }
.controls {
  display:flex;
  gap:12px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.controls input,.controls select {
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:white;
  flex:1;
  min-width:180px;
}
.categories {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:28px;
}
.category {
  background:white;
  border:1px solid #DCCFE6;
  color:var(--purple);
  padding:10px 17px;
  border-radius:25px;
}
.category.active {
  background:var(--purple);
  color:white;
}
h2 { color:var(--purple); }
.products {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
}
.card {
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 15px #59447712;
  border:1px solid #EEE8F0;
}
.photo {
  height:265px;
  background:#F0E9F5;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--muted);
  text-align:center;
}
.photo img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.info { padding:16px; }
.store { font-size:12px;color:var(--muted); }
.info h3 {
  font-size:15px;
  margin:8px 0;
  min-height:48px;
}
.price {
  font-size:19px;
  color:var(--purple);
  font-weight:800;
}
.price small { font-size:11px;font-weight:400; }
.actions {
  display:grid;
  gap:8px;
  margin-top:12px;
}
.btn {
  border:0;
  border-radius:10px;
  padding:11px;
  text-align:center;
  font-size:13px;
  font-weight:700;
}
.buy { background:var(--purple);color:white; }
.size { background:var(--lavender);color:var(--purple); }
.empty {
  grid-column:1/-1;
  background:white;
  padding:35px;
  border-radius:15px;
  text-align:center;
  color:var(--muted);
  line-height:1.9;
}
footer {
  text-align:center;
  padding:30px;
  color:var(--muted);
  font-size:12px;
}
dialog {
  width:min(650px,94vw);
  max-height:90vh;
  padding:0;
  border:1px solid var(--border);
  border-radius:22px;
  background:var(--cream);
  color:var(--dark);
  overflow:auto;
}
dialog::backdrop { background:#20142899; }
.modal-header {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  padding:22px;
  background:var(--lavender);
}
.modal-header h2 { margin:0; }
.modal-header p {
  margin:5px 0;
  font-size:13px;
  line-height:1.9;
}
.close {
  border:0;
  background:white;
  color:var(--purple);
  border-radius:50%;
  width:36px;
  height:36px;
  flex-shrink:0;
  font-size:24px;
}
.modal-body { padding:22px; }
.note {
  font-size:13px;
  color:var(--muted);
  line-height:1.9;
  margin:0 0 16px;
}
.fields {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.field label {
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}
.field input,.field select {
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  background:white;
}
.field small {
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
  line-height:1.8;
}
.calculate { width:100%;margin-top:20px; }
.result {
  margin-top:20px;
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  line-height:1.9;
  font-size:13px;
  overflow-wrap:anywhere;
}
.result h3 { color:var(--purple);margin:0 0 8px; }
.result p { margin:8px 0; }
.result.match {
  border-color:#8BAE99;
  background:#F3FAF5;
}
.result.caution {
  border-color:#D8BF86;
  background:#FFFBF2;
}
details { margin-top:22px; }
summary {
  color:var(--purple);
  font-weight:700;
  cursor:pointer;
  font-size:13px;
}
.table-wrap { overflow-x:auto; }
table {
  border-collapse:collapse;
  width:100%;
  margin-top:15px;
  font-size:12px;
  background:white;
}
th,td {
  padding:10px 7px;
  border-bottom:1px solid var(--border);
  text-align:center;
  white-space:nowrap;
}
th { background:var(--lavender);color:var(--purple); }
[hidden] { display:none!important; }
@media(max-width:950px) {
  .products { grid-template-columns:repeat(3,1fr); }
}
@media(max-width:650px) {
  .products {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  .photo { height:200px; }
  .info { padding:11px; }
  nav { gap:12px; }
}
@media(max-width:400px) {
  .fields { grid-template-columns:1fr; }
  .products { grid-template-columns:1fr; }
}
</style>
</head>

<main>

</main>

<footer>قياسات | مقاسك يبدأ من هنا</footer>

<dialog id="sizeDialog" aria-labelledby="sizeTitle">

    <details id="chartDetails">

        <table>

    </details>
  </div>
</dialog>

};

const storeAliases = {
  blacklife:[
    'Black & Life','Black and Life','Black Life',
    'BlackLife','بلاك اند لايف','بلاك أند لايف',
    'بلاك اند ليف','بلاك آند ليف',
    'متجر بلاك اند لايف'

  ]
};

function normalizeStoreName(value) {
  return String(value || '')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[أإآ]/g,'ا')
    .replace(/[^a-z0-9\u0621-\u063A\u0641-\u064A]/g,'');
}

const aliasLookup = new Map();
Object.entries(storeAliases).forEach(([key,names]) => {
  names.forEach(name => {
    aliasLookup.set(normalizeStoreName(name),key);
  });
});

function getChartKey(product) {
  return aliasLookup.get(
    normalizeStoreName(product?.store)
  ) || null;
}

function safeWebUrl(value) {
  try {
    const url = new URL(value);
    return ['https:','http:'].includes(url.protocol)
      ? url.href : '';
  } catch {
    return '';
  }
}

function relationOne(value) {
  return Array.isArray(value) ? value[0] : value;
}

let products = [];
let loading = true;
let loadError = false;
let activeProduct = null;
let activeChart = null;

const params = new URLSearchParams(location.search);
let selectedCategory = params.get('category') || 'all';

if (!categories.some(c => c.id === selectedCategory)) {
  selectedCategory = 'all';
}

const categoryBox = document.getElementById('categories');
const productBox = document.getElementById('products');
const searchBox = document.getElementById('search');
const sortBox = document.getElementById('sort');

const sizeDialog = document.getElementById('sizeDialog');
const sizeForm = document.getElementById('sizeForm');
const sizeFields = document.getElementById('sizeFields');
const sizeResult = document.getElementById('sizeResult');
const chartNote = document.getElementById('chartNote');
const chartHead = document.getElementById('chartHead');
const chartBody = document.getElementById('chartBody');

function showMessage(message) {
  productBox.replaceChildren();
  const box = document.createElement('div');
  box.className = 'empty';
  box.textContent = message;
  productBox.appendChild(box);
}

async function loadProducts() {
  loading = true;
  loadError = false;
  showMessage('جاري تحميل المنتجات...');

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(),20000);

  try {
    const endpoint = new URL(
      SUPABASE_URL + '/rest/v1/products'
    );

    endpoint.searchParams.set(
      'select',
      'id,name,price,currency,image_url,product_url,' +
      'categories(slug),stores(name)'
    );
    endpoint.searchParams.set('status','eq.active');
    endpoint.searchParams.set('order','created_at.desc');

    const response = await fetch(endpoint.toString(),{
      headers:{
        apikey:SUPABASE_KEY,
        Accept:'application/json'
      },
      signal:controller.signal
    });

    if (!response.ok) {
      throw new Error('HTTP '+response.status);
    }

    const rows = await response.json();

    if (!Array.isArray(rows)) {
      throw new Error('استجابة غير صحيحة');
    }

    products = rows.map(row => {
      const category = relationOne(row.categories);
      const store = relationOne(row.stores);

      return {
        id:row.id,
        name:String(row.name || 'منتج بدون اسم'),
        category:category?.slug || '',
        store:String(store?.name || 'متجر مشارك'),
        price:row.price == null ? null : Number(row.price),
        currency:row.currency || 'SAR',
        image:safeWebUrl(row.image_url),
        url:safeWebUrl(row.product_url)
      };
    });

    loading = false;
    renderProducts();
  } catch(error) {
    console.error('تعذر تحميل المنتجات:',error);
    loading = false;
    loadError = true;
    showMessage(
      'تعذر تحميل المنتجات. تحققي من الاتصال وأعيدي تحميل الصفحة.'
    );
  } finally {
    clearTimeout(timeout);
  }
}

function renderCategories() {
  categoryBox.replaceChildren();

  categories.forEach(category => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'category' +
      (selectedCategory === category.id ? ' active' : '');
    button.textContent = category.name;
    button.setAttribute(
      'aria-pressed',
      String(selectedCategory === category.id)
    );

    button.addEventListener('click',() => {
      selectedCategory = category.id;

      const url = new URL(location.href);
      if (category.id === 'all') {
        url.searchParams.delete('category');
      } else {
        url.searchParams.set('category',category.id);
      }

      history.replaceState({},'',url);
      renderCategories();
      renderProducts();
    });

    categoryBox.appendChild(button);
  });
}

function formatPrice(product) {
  try {
    return new Intl.NumberFormat('ar-SA',{
      style:'currency',
      currency:product.currency
    }).format(product.price);
  } catch {
    return product.price.toFixed(2)+' '+product.currency;
  }
}

function renderProducts() {
  const current = categories.find(
    c => c.id === selectedCategory
  );

  document.getElementById('title').textContent =
    selectedCategory === 'all'
      ? 'منتجات قياسات'
      : current.name;

  document.getElementById('heading').textContent =
    selectedCategory === 'all'
      ? 'جميع المنتجات'
      : 'منتجات '+current.name;

  if (loading) {
    showMessage('جاري تحميل المنتجات...');
    return;
  }

  if (loadError) {
    showMessage('تعذر تحميل المنتجات.');
    return;
  }

  productBox.replaceChildren();

  const query = searchBox.value.trim().toLowerCase();

  const list = products.filter(product => {
    const categoryMatch =
      selectedCategory === 'all' ||
      product.category === selectedCategory;

    const searchMatch =
      product.name.toLowerCase().includes(query) ||
      product.store.toLowerCase().includes(query);

    return categoryMatch && searchMatch;
  });

  if (sortBox.value !== 'default') {
    list.sort((a,b) => {
      const av = Number.isFinite(a.price);
      const bv = Number.isFinite(b.price);
      if (!av && !bv) return 0;
      if (!av) return 1;
      if (!bv) return -1;
      return sortBox.value === 'low'
        ? a.price-b.price
        : b.price-a.price;
    });
  }

  if (!list.length) {
    showMessage(
      query
        ? 'لا توجد منتجات مطابقة لبحثك.'
        : 'لا توجد منتجات منشورة في هذا القسم حاليًا.'
    );
    return;
  }

  list.forEach(product => {
    const card = document.createElement('article');
    card.className = 'card';

    const photo = document.createElement('div');
    photo.className = 'photo';

    if (product.image) {
      const img = document.createElement('img');
      img.src = product.image;
      img.alt = product.name;
      img.loading = 'lazy';
      img.onerror = () => {
        photo.textContent = 'صورة المنتج غير متاحة';
      };
      photo.appendChild(img);
    } else {
      photo.textContent = 'صورة المنتج غير متاحة';
    }

    const info = document.createElement('div');
    info.className = 'info';

    const store = document.createElement('div');
    store.className = 'store';
    store.textContent = product.store;

    const title = document.createElement('h3');
    title.textContent = product.name;

    const price = document.createElement('div');
    price.className = 'price';

    if (Number.isFinite(product.price)) {
      price.textContent = formatPrice(product);
      const small = document.createElement('small');
      small.textContent = 'السعر قابل للتغيير لدى المتجر';
      price.append(document.createElement('br'),small);
    } else {
      price.textContent = 'السعر لدى المتجر';
    }

    const actions = document.createElement('div');
    actions.className = 'actions';

    if (product.url) {
      const buy = document.createElement('a');
      buy.className = 'btn buy';
      buy.href = product.url;
      buy.target = '_blank';
      buy.rel = 'noopener noreferrer';
      buy.textContent = 'شراء من المتجر';
      actions.appendChild(buy);
    }

    const size = document.createElement('button');
    size.type = 'button';
    size.className = 'btn size';
    size.textContent = 'اعرفي مقاسك';
    size.addEventListener('click',() => {
      openSizeDialog(product);
    });

    actions.appendChild(size);
    info.append(store,title,price,actions);
    card.append(photo,info);
    productBox.appendChild(card);
  });
}

function clearResult() {
  sizeResult.hidden = true;
  sizeResult.className = 'result';
  sizeResult.replaceChildren();
}

function addResult(title,message,success=false) {
  clearResult();
  sizeResult.hidden = false;
  sizeResult.classList.add(success ? 'match' : 'caution');

  const h = document.createElement('h3');
  h.textContent = title;

  const p = document.createElement('p');
  p.textContent = message;

  sizeResult.append(h,p);
}

function displayValue(value) {
  if (Array.isArray(value)) {
    return value[0]+'–'+value[1];
  }
  return value == null ? '—' : String(value);
}

function renderChart(chart) {
  chartHead.replaceChildren();
  chartBody.replaceChildren();

  const heading = document.createElement('tr');
  chart.columns.forEach(([,label]) => {
    const th = document.createElement('th');
    th.textContent = label;
    heading.appendChild(th);
  });
  chartHead.appendChild(heading);

  chart.rows.forEach(row => {
    const tr = document.createElement('tr');
    chart.columns.forEach(([key]) => {
      const td = document.createElement('td');
      const bdi = document.createElement('bdi');
      bdi.dir = 'ltr';
      bdi.textContent = displayValue(row[key]);
      td.appendChild(bdi);
      tr.appendChild(td);
    });
    chartBody.appendChild(tr);
  });
}

function createNumberField(key) {
  const wrap = document.createElement('div');
  wrap.className = 'field';

  const label = document.createElement('label');
  label.htmlFor = 'measure_'+key;
  label.textContent = fieldLabels[key]+' (سم)';

  const input = document.createElement('input');
  input.type = 'number';
  input.id = 'measure_'+key;
  input.name = key;
  input.min = '0.1';
  input.step = 'any';
  input.inputMode = 'decimal';
  input.required = true;

  wrap.append(label,input);
  sizeFields.appendChild(wrap);
}

function createSelectField(chart) {
  const wrap = document.createElement('div');
  wrap.className = 'field';

  const label = document.createElement('label');
  label.htmlFor = 'garmentChoice';
  label.textContent =
    chart === charts.sj
      ? 'طول العباية (إنش)'
      : 'اختاري المقاس لعرض قياساته';

  const select = document.createElement('select');
  select.id = 'garmentChoice';
  select.name = 'choice';
  select.required = true;

  const first = document.createElement('option');
  first.value = '';
  first.textContent = 'اختاري من القائمة';
  select.appendChild(first);

  chart.rows.forEach((row,index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent =
      chart === charts.sj
        ? row.length+' إنش'
        : row.size;
    select.appendChild(option);
  });

  wrap.append(label,select);
  sizeFields.appendChild(wrap);
}

function openSizeDialog(product) {
  activeProduct = product;
  const key = getChartKey(product);
  activeChart = key ? charts[key] : null;

  document.getElementById('selectedProduct').textContent =
    product.name+' — '+product.store;

  sizeFields.replaceChildren();
  sizeForm.reset();
  clearResult();
  document.getElementById('chartDetails').open = false;

  if (!activeChart) {
    chartNote.textContent =
      'لم يتوفر جدول مقاسات لهذا المتجر. '+
      'راجعي دليل المقاسات لدى المتجر.';
    sizeForm.hidden = true;
    document.getElementById('chartDetails').hidden = true;
    sizeDialog.showModal();
    return;
  }

  sizeForm.hidden = false;
  document.getElementById('chartDetails').hidden = false;
  renderChart(activeChart);

  if (activeChart.type === 'bodyRange') {
    chartNote.textContent =
      'أدخلي قياسات جسمك بالسنتيمتر. '+
      'سنبحث عن المقاس الذي يشمل جميع قياساتك '+
      'ضمن نطاقاته المنشورة في جدول المتجر.';
    activeChart.fields.forEach(createNumberField);
  } else if (activeChart.type === 'bodyPoints') {
    chartNote.textContent =
      'أدخلي قياسات جسمك بالسنتيمتر. '+
      'سنقارنها بالقيم المرجعية للمتجر. '+
      'النتيجة استرشادية لأن الجدول لا يوضح '+
      'نطاقًا كاملًا لكل مقاس.';
    activeChart.fields.forEach(createNumberField);
  } else {
    chartNote.textContent =
      'هذا الجدول يعرض قياسات القطعة، وليس '+
      'محيط جسم العميلة. اختاري المقاس أو الطول '+
      'لعرض القياسات الأصلية دون افتراض ملاءمته لجسمك. '+
      'الوحدة: '+activeChart.unit+'.';
    createSelectField(activeChart);
  }

  sizeDialog.showModal();
}

function within(value,range) {
  return value >= range[0] && value <= range[1];
}

function calculateRange(chart,values) {
  const matches = chart.rows.filter(row =>
    chart.fields.every(key => within(values[key],row[key]))
  );

  if (matches.length === 1) {
    addResult(
      'المقاس المطابق للجدول: '+matches[0].size,
      'جميع القياسات المدخلة تقع ضمن نطاقات هذا المقاس. '+
      'هذه مطابقة للجدول وليست ضمانًا لملاءمة قصة القطعة.',
      true
    );
  } else if (matches.length > 1) {
    addResult(
      'أكثر من مقاس مطابق',
      'المقاسات المطابقة: '+
      matches.map(row => row.size).join('، ')+
      '. قياساتك تقع على حدود مشتركة؛ راجعي المتجر.'
    );
  } else {
    addResult(
      'لا يوجد مقاس مطابق بالكامل',
      'لا يوجد مقاس واحد يشمل جميع القياسات '+
      'التي أدخلتِها. راجعي المتجر قبل الشراء.'
    );
  }
}

function calculatePoints(chart,values) {
  /*
    القيم المنشورة ليست نطاقات.
    نعرض فقط المطابقة الرقمية التامة لجميع القياسات،
    ولا نخترع حدودًا بين المقاسات.
  */
  const exact = chart.rows.filter(row =>
    chart.fields.every(key =>
      Math.abs(row[key]-values[key]) < 0.005
    )
  );

  if (exact.length === 1) {
    addResult(
      'مطابقة رقمية: '+exact[0].size,
      'قياساتك تساوي القيم المنشورة لهذا المقاس. '+
      'تأكدي من المتجر أن الجدول يصف قياسات الجسم '+
      'وليس قياسات القطعة قبل اعتماد الاختيار.',
      false
    );
  } else if (exact.length > 1) {
    addResult(
      'أكثر من مطابقة رقمية',
      'القيم تطابق: '+
      exact.map(row => row.size).join('، ')+
      '. راجعي المتجر لتحديد الأنسب.'
    );
  } else {
    addResult(
      'لا توجد مطابقة رقمية كاملة',
      'جدول المتجر يحتوي على قيم منفردة، '+
      'ولا يوضح نطاقات المقاسات. '+
      'لا يمكن تحديد المقاس بثقة دون قواعد إضافية من المتجر.'
    );
  }
}

function calculateGarment(chart,formData) {
  const index = Number(formData.get('choice'));
  const row = chart.rows[index];

  if (!row) {
    addResult('اختيار غير صحيح','اختاري قيمة من القائمة.');
    return;
  }

  const details = chart.columns
    .map(([key,label]) =>
      label+': '+displayValue(row[key])+
      (key === 'size' ? '' : ' '+chart.unit)
    )
    .join(' | ');

  addResult(
    'قياسات القطعة المختارة',
    details+
    '. هذه أبعاد منشورة من المتجر، '+
    'ولا تؤكد أن القطعة مناسبة لمحيط جسمك.',
    true
  );
}

sizeForm.addEventListener('submit',event => {
  event.preventDefault();
  if (!activeChart || !sizeForm.reportValidity()) return;

  const formData = new FormData(sizeForm);

  if (activeChart.type === 'garment') {
    calculateGarment(activeChart,formData);
    return;
  }

  const values = {};
  for (const key of activeChart.fields) {
    values[key] = Number(formData.get(key));
  }

  if (!Object.values(values).every(
    value => Number.isFinite(value) && value > 0
  )) {
    addResult(
      'قياسات غير صحيحة',
      'أدخلي أرقامًا صحيحة أكبر من صفر.'
    );
    return;
  }

  if (activeChart.type === 'bodyRange') {
    calculateRange(activeChart,values);
  } else {
    calculatePoints(activeChart,values);
  }
});

sizeForm.addEventListener('input',clearResult);

document.getElementById('closeDialog')
  .addEventListener('click',() => sizeDialog.close());

sizeDialog.addEventListener('close',() => {
  activeProduct = null;
  activeChart = null;
});

searchBox.addEventListener('input',renderProducts);
sortBox.addEventListener('change',renderProducts);

renderCategories();
loadProducts();
</script>
